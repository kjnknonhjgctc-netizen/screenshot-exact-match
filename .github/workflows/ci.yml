name: Delux quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The repository already has broad legacy lint debt; keep reporting it without
      # preventing the regression tests and production build from running.
      - name: Run ESLint (legacy lint debt is non-blocking)
        run: bun run lint
        continue-on-error: true

      - name: Run Vitest
        run: bun run test

      - name: Build production app
        run: bun run build
